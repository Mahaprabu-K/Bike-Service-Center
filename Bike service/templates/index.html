<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../static/index.css">

  <link rel="icon" type="jpg"
    href="https://img.freepik.com/premium-vector/motoservicio-white-background_917213-250266.jpg">

  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <title>BIKE SERVICE CENTER</title>
</head>

<body>

  <header>
    <div class="logos">
      <img src="../static/images/name.png" alt="Omega Bike Services name">
    </div>

    <div class="content">
      <a href="#">About Us</a>
      <a href="#">Our vision</a>
      <a href="#">Why Choose Us</a>
      <a href="#">Happy Clients</a>
      <a href="#"><i class="fa-solid fa-location-dot"></i> Location</a>
    </div>

  <div class="user" id="userSection">
    <a class="in" href="/signin">Sign In</a>
    <a class="up" href="/signup">Sign Up</a>
</div>
  </header>

  <div class="container">

    <div class="indexcover">
      <img src="../static/images/indeximg.png" alt="index cover">
    </div>
  <form id="index" class="formcontainer" method="POST" action="/submit">

  <!-- VEHICLE -->
  <select id="vehicle" name="vehicle" required>
    <option value="" disabled selected>Select Vehicle</option>
  </select>

  <!-- BRAND -->
  <select id="brand" name="brand" required>
    <option value="" disabled selected>Select Brand</option>
  </select>

  <!-- MODEL -->
  <select id="model" name="model" required>
    <option value="" disabled selected>Select Model</option>
  </select>

  <!-- FUEL -->
  <select id="fuel" name="fuel" required>
    <option value="" disabled selected>Select Fuel</option>
  </select>

  <button onclick="goNext()" class="letgo">LETS GO</button>

</form>
  </div>
  </div>

  <div class="container2">

    <h2 class="head">Bike Service Solutions</h2>

    <div class="offers">
      <a href="general service" class="GS"><img src="../static/images/general bike.png">General Service</a>


       <a href="general service" class="Vb"><img src="../static/images/bike breakdown.png">Vehicle Breakdown</a>


       <a href="general service" class="Vb"><img src="../static/images/bike wash.png">Major Repairs</a>

    </div>

    <div class="offers2">

      <a href="general service" class="GS"><img class="" src="../static/images/bike wash.png">Wash & polish</a>


       <a href="general service" class="Vb"><img src="../static/images/bike-engine.png">Engine Reboring</a>

       <a href="general service" class="Vb"><img src="../static/images/bike offers.png">Offers</a>

    </div>

  </div>

  <script src="../static/javascript/index.js"></script>

</body>

</html>
